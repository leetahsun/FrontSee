<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
        <title>Miri Chan</title>
    </head>

    <body>
        <!-- the screen with envelope-->
        <div id="envelope-container">
            <img src="envelope.png" alt="Envelope" id="envelope" />
            <p>You've got mail!</p>
        </div>
        <!-- Screen for letter-->
        <div id="letter-container">
            <div class="letter-window">
                <h1 id="letter-title">Do you hate me?</h1>

                <img src="cat.gif" class="cat" id="letter-cat" />

                <div class="buttons" id="letter-buttons">
                    <img src="yes.png" class="btn yes-btn" alt="Yes" />

                    <div class="no-wrapper">
                        <img src="no.png" class="btn no-btn" alt="No" />
                    </div>
                </div>

                <p id="final-text" class="final-text" style="display: none">
                    <strong>I knew it!!:</strong> I'm kidddingg

                </p>
            </div>
        </div>
        <script src="script.js"></script>
    </body>

</html>
